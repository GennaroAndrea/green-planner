# Render Blueprint for the fallback deploy (Q51). Free plan: the service sleeps after 15 min
# without traffic and takes about a minute to wake up, so open it a few minutes before the demo.
services:
  - type: web
    name: green-planner
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeploy: true
