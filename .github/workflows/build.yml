# Builds the Docker image and pushes it to GHCR (Q60), after a green "Test" run on main or by
# hand (any branch). Tags: the commit SHA, plus `latest` for main.
name: Build and publish

on:
  workflow_run:
    workflows: [Test]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: build-${{ github.event.workflow_run.head_branch || github.ref_name }}
  cancel-in-progress: false

jobs:
  image:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      # workflow_run starts on the default branch's latest commit: build the commit that was tested
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Image name and tags
        id: meta
        env:
          SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          BRANCH: ${{ github.event.workflow_run.head_branch || github.ref_name }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          tags="$image:$SHA"
          if [ "$BRANCH" = "main" ]; then tags="$tags,$image:latest"; fi
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
          echo "Image: \`$image:$SHA\` (branch \`$BRANCH\`)" >> "$GITHUB_STEP_SUMMARY"

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          # A plain single-platform manifest (no attestation index)
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
