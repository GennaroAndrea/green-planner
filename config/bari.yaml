# City configuration for Bari.
# Parameter values follow the decision log in docs/requirements_and_plan.md §10.0.

city: bari

crs:
  compute: EPSG:32633  # WGS84 / UTM 33N, metric: areas, distances, grid
  web: EPSG:4326       # output for the frontend

ckan_api: https://dati.puglia.it/ckan/api/3/action

# Extra intermediate certificates for hosts that don't send their full chain
# (sit.egov.ba.it, www.arpa.puglia.it). Verification stays enabled.
extra_ca_file: config/certs/intermediates.pem

# ---------------------------------------------------------------------------
# Data sources (downloaded by `python -m pipeline download` into data/raw/<key>/)
#   type ckan : resolve all resources of a dati.puglia.it dataset (optionally filtered)
#   type url  : explicit list of files
#   optional  : failure doesn't fail the whole download
# ---------------------------------------------------------------------------
sources:
  green_areas:  # D1
    type: ckan
    dataset: aree-verdi

  traffic_flows:  # D2, one CSV per month
    type: ckan
    dataset: centraline-semaforiche-flussi-di-traffico-giornalieri

  traffic_controllers:  # D3, one JSON per month
    type: ckan
    dataset: centraline-semaforiche-posizionamento-e-sensoristica-a-bordo

  air_stations:  # D5
    type: url
    files:
      - url: http://old.arpa.puglia.it/ARPA_ARIA/centraline.jsp
        filename: stations.geojson

  air_daily_api:  # D4, previous day only; fallback source for the annual means
    type: url
    optional: true
    dated: true  # filename gets today's date, so repeated runs build a history
    files:
      - url: https://cloud.arpa.puglia.it/QualitaAria?format=GeoJSON
        filename: qualita_aria.geojson

  population:  # D6, cumulative age bands: under14 ⊂ under18 ⊂ under67; over67 separate
    type: ckan
    dataset: popolazione-residente1

  sit:  # D8, SIT Comune di Bari ("civilario unico")
    type: url
    files:
      - url: https://sit.egov.ba.it/vector/api/shp/qdjango/384/vwm_db_grafo_civico20210224101146733/
        filename: civici.zip
      - url: https://sit.egov.ba.it/vector/api/shp/qdjango/384/quartieri20200616115305907/
        filename: quartieri.zip
      - url: https://sit.egov.ba.it/vector/api/shp/qdjango/384/municipi20200616115312092/
        filename: municipi.zip
      - url: https://sit.egov.ba.it/vector/api/shp/qdjango/384/Confine_Comunale_Bari20200227151955299/
        filename: confine_comunale.zip

  circoscrizioni_2013:  # D9, fallback neighbourhood boundaries
    type: url
    files:
      - url: https://opendata.comune.bari.it/dataset/82532fb7-2d49-452f-aefe-1552c0c4d2c7/resource/77b9fa9b-71a7-4c11-8d62-49d29bfc2990/download/20130222t140509circoscrizioni.zip
        filename: circoscrizioni.zip

  land_use_2011:  # Uso del Suolo 2011, only artificial surfaces + legend (urban mask)
    type: ckan
    dataset: uso-del-suolo-2011-uds
    name_pattern: "Superfici Artificiali|Legenda"

  eprtr:  # D10, EEA Industrial Reporting v16 (2007-2024), user-friendly CSV bundle (~148 MB)
    type: url
    files:
      - url: https://sdi.eea.europa.eu/datashare/public.php/dav/files/sptXqwkQr5g7Bp5/eea_t_ied-eprtr_p_2007-2024_v16_r00/User%20friendly%20.csv%20files.zip
        filename: eprtr_csv_v16.zip

  sentinel2_ndvi:  # Q49: Copernicus Sentinel-2 L2A (10 m), median NDVI of the clear summer scenes
    type: stac_ndvi_composite
    stac_api: https://planetarycomputer.microsoft.com/api/stac/v1
    sas_token_url: https://planetarycomputer.microsoft.com/api/sas/v1/token/sentinel-2-l2a
    collection: sentinel-2-l2a
    mgrs_tile: 33TXF  # the whole municipality lies in this tile
    datetime: 2025-06-01/2025-08-31
    max_cloud_cover: 1  # % over the tile
    bbox: [16.70, 40.98, 17.05, 41.20]  # WGS84, around the municipal boundary
    filename: ndvi_median_2025_summer.tif

# ---------------------------------------------------------------------------
# Model parameters
# ---------------------------------------------------------------------------
grid:
  cell_sizes_m: [250, 500]  # Q7
  default_cell_size_m: 250

urban_mask:  # Q6
  # 50 residents per 250 m cell, applied as a density so 500 m and clipped edge cells use the same rule
  min_resident_density_km2: 800
  min_artificial_share: 0.30
  # Clipped cells smaller than this share of a full cell (slivers along the boundary) are dropped
  min_cell_area_share: 0.10

population:  # Q4
  exclude_uncovered_zones: true
  # IPF indicator = total residents (under67 + over67), as density. Vulnerable = under14 + over67.
  indicator: density_km2

# Neighbourhoods (Q16): SIT quartieri. `sit_name` is the `nome` field in quartieri.zip,
# `rione` the RIONE value in the population CSVs (null = not covered, excluded from the analysis).
zones:
  aggregate_from_cell_size_m: 250  # zone aggregates are computed from this grid
  items:
    - {id: 1, sit_name: "I - SAN NICOLA", name: "San Nicola", rione: "SAN NICOLA"}
    - {id: 2, sit_name: "II - MURAT", name: "Murat", rione: "MURAT"}
    - {id: 3, sit_name: "III - MADONNELLA", name: "Madonnella", rione: "MADONNELLA"}
    - {id: 4, sit_name: "IV - LIBERTA'", name: "Libertà", rione: "LIBERTA'"}
    - {id: 5, sit_name: "V - JAPIGIA", name: "Japigia", rione: "JAPIGIA"}
    - {id: 6, sit_name: "VI - SAN PASQUALE", name: "San Pasquale", rione: "SAN PASQUALE"}
    - {id: 7, sit_name: "VII - CARRASSI", name: "Carrassi", rione: "CARRASSI"}
    - {id: 8, sit_name: "VIII - PICONE", name: "Picone", rione: "PICONE"}
    - {id: 9, sit_name: "IX - STANIC", name: "Stanic", rione: "STANIC"}
    - {id: 10, sit_name: "X  - MARCONI - SAN GIROLAMO - FESCA", name: "Marconi - San Girolamo - Fesca", rione: "MARCONI-SAN GIROLAMO FESCA"}
    - {id: 11, sit_name: "XI - SAN PAOLO", name: "San Paolo", rione: "SAN PAOLO"}
    - {id: 12, sit_name: "XII - PALESE - MACCHIE", name: "Palese - Macchie", rione: "PALESE MACCHIE"}
    - {id: 13, sit_name: "XIII - SANTO SPIRITO", name: "Santo Spirito", rione: "SANTO SPIRITO"}
    - {id: 14, sit_name: "XIV - CARBONARA DI BARI", name: "Carbonara", rione: "CARBONARA"}
    - {id: 15, sit_name: "XV - CEGLIE DEL CAMPO", name: "Ceglie del Campo", rione: "CEGLIE"}
    - {id: 16, sit_name: "XVI - LOSETO", name: "Loseto", rione: "LOSETO"}
    - {id: 17, sit_name: "XVII - TORRE A MARE", name: "Torre a Mare", rione: null}

traffic:  # Q8
  aggregate_detectors: sum
  exclude_months: ["2025-08"]
  zero_is_missing: true
  # Detector-days above this are sensor errors, treated as missing (Q25): one lane can't carry
  # more than ~2,000 veh/h. E.g. BG022 has one-day spikes of 131,674 between days of ~450.
  max_detector_daily_vehicles: 50000
  kernel_sigma_m: 300
  # Kernel weights below this are set to 0 (1% ≈ 910 m with σ = 300 m). Without it, the log
  # transform turns the Gaussian tail into mid-range scores far from any sensor.
  kernel_min_weight: 0.01
  # Controllers whose mean daily total exceeds Q3 + k * IQR are flagged (kept, shown in the layer)
  outlier_iqr_factor: 3

air:  # Q3, Q19
  pollutants: [NO2, PM10, PM2.5]
  idw_power: 2
  annual_means_file: data/manual/arpa_annual_2025.csv
  limit_values_ugm3:  # EU Directive 2024/2881, annual limits applicable from 2030
    NO2: 20
    PM10: 20
    PM2.5: 10

industry:  # Q5, Q18
  radius_km: 10
  min_facilities: 3
  recent_years: 5  # only facilities reporting in the last N reporting years count
  pollutants: [NOX, PM10]

normalisation:  # Q9
  method: robust_minmax
  lower_percentile: 5
  upper_percentile: 95
  log_transform: [traffic, population]

weights:  # Q10, percentage points; redistributed proportionally if an indicator is dropped
  pollution: 20
  green_deficit: 30
  traffic: 20
  population: 20
  industry: 10

classes:  # Q11
  count: 4
  method: quantile

vegetation:  # Q49: a 10 m pixel is vegetated when its summer median NDVI is at least this
  ndvi_threshold: 0.30

trees:  # Q12; since Q49 the green share is the satellite vegetation share
  target_green_share: 0.15
  plantable_fraction: 0.25
  crown_area_m2: 30

sensitivity:  # Q17
  runs: 1000
  seed: 42
  spread_pp: 5
  top_n_zones: 10
  top_share_cells: 0.10
  robust_threshold: 0.80
  one_at_a_time_delta_pp: 10
