[project]
name = "green-planner"
version = "0.1.0"
description = "Urban green planning decision support: Forestation Priority Index (IPF) for Bari from Open Data Puglia"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # pipeline
    "geopandas>=1.0",
    "shapely>=2.0",
    "pyproj>=3.6",
    "pyogrio>=0.9",
    "pandas>=2.2",
    "numpy>=2.0",
    "scipy>=1.13",
    "pyarrow>=16",
    "pyyaml>=6.0",
    "httpx>=0.27",
    # backend
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "rasterio>=1.4",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pipeline", "backend"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
